<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>클릭 효과 후보</title>
    <style>
      :root {
        --bg-top: #fbf2e7;
        --bg-bottom: #e8d0b5;
        --section: #f1d9b6;
        --control: #fff3e1;
        --line: #c7a87e;
        --line-soft: #dec49e;
        --text: #251f18;
        --muted: #756753;
        --red: #b34239;
        --deep: #273f35;
        --shadow: rgba(63, 38, 18, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: "Wanted Sans", "Pretendard", "Segoe UI", sans-serif;
        background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      }

      main {
        width: min(100%, 430px);
        margin: 0 auto;
        padding: 18px;
      }

      h1 {
        margin: 4px 0 6px;
        font-size: 24px;
        line-height: 1.15;
      }

      .note {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .candidate {
        margin: 14px 0;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--section);
        box-shadow: 0 8px 22px var(--shadow);
      }

      .candidate h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .candidate p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .demo-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .demo-button {
        position: relative;
        min-width: 118px;
        min-height: 40px;
        overflow: hidden;
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: var(--control);
        color: var(--text);
        font: inherit;
        font-weight: 900;
        touch-action: manipulation;
      }

      .tile-button {
        border: 0;
        background: transparent;
        padding: 0;
        touch-action: manipulation;
      }

      .tile-demo {
        width: 42px;
        height: 56px;
        display: block;
        object-fit: contain;
        pointer-events: none;
      }

      .press .demo-button,
      .press .tile-button {
        transition: transform 90ms ease, box-shadow 90ms ease, filter 90ms ease;
      }

      .press .demo-button:active,
      .press .tile-button:active,
      .press .is-clicked {
        transform: scale(0.97) translateY(1px);
        filter: brightness(0.98);
        box-shadow: inset 0 2px 4px rgba(63, 38, 18, 0.16);
      }

      .ripple .demo-button::after,
      .ripple .tile-button::after {
        content: "";
        position: absolute;
        inset: 50% auto auto 50%;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(179, 66, 57, 0.22);
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
      }

      .ripple .tile-button {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
      }

      .ripple .is-clicked::after {
        animation: ripple 420ms ease-out;
      }

      @keyframes ripple {
        0% {
          opacity: 0.95;
          transform: translate(-50%, -50%) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(18);
        }
      }

      .border .demo-button,
      .border .tile-button {
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      .border .tile-button {
        border: 1px solid transparent;
        border-radius: 8px;
      }

      .border .is-clicked {
        border-color: var(--red);
        box-shadow: 0 0 0 3px rgba(179, 66, 57, 0.18);
        animation: borderPulse 360ms ease;
      }

      @keyframes borderPulse {
        0% {
          box-shadow: 0 0 0 0 rgba(179, 66, 57, 0.28);
        }
        100% {
          box-shadow: 0 0 0 7px rgba(179, 66, 57, 0);
        }
      }

      .tile-pop .demo-button,
      .tile-pop .tile-demo {
        transition: transform 130ms cubic-bezier(.2, .9, .2, 1.15), filter 130ms ease;
      }

      .tile-pop .is-clicked.demo-button {
        transform: translateY(-1px);
        filter: brightness(1.02);
      }

      .tile-pop .is-clicked .tile-demo,
      .tile-pop .tile-button:active .tile-demo {
        transform: translateY(-3px) scale(1.04);
        filter: drop-shadow(0 5px 4px rgba(63, 38, 18, 0.2));
      }
    </style>
  </head>
  <body>
    <main>
      <h1>클릭 효과 후보</h1>
      <p class="note">각 후보의 버튼과 패를 직접 눌러보고 고르면 됩니다. 아직 앱에는 적용하지 않았습니다.</p>

      <section class="candidate press">
        <h2>A. 눌림형</h2>
        <p>가장 조용한 효과. 버튼이 아주 살짝 눌렸다가 돌아옵니다.</p>
        <div class="demo-row">
          <button class="demo-button">론</button>
          <button class="tile-button" aria-label="패 효과 보기"><img class="tile-demo" src="../assets/tiles/b2/Man3.png" alt=""></button>
        </div>
      </section>

      <section class="candidate ripple">
        <h2>B. 잉크형</h2>
        <p>짧은 번짐이 생깁니다. 터치 피드백은 분명하지만 조금 앱스럽습니다.</p>
        <div class="demo-row">
          <button class="demo-button">쯔모</button>
          <button class="tile-button" aria-label="패 효과 보기"><img class="tile-demo" src="../assets/tiles/b2/Pin5-Dora.png" alt=""></button>
        </div>
      </section>

      <section class="candidate border">
        <h2>C. 테두리형</h2>
        <p>색이 크게 움직이지 않고 선택 테두리만 짧게 반응합니다.</p>
        <div class="demo-row">
          <button class="demo-button">리치</button>
          <button class="tile-button" aria-label="패 효과 보기"><img class="tile-demo" src="../assets/tiles/b2/Sou7.png" alt=""></button>
        </div>
      </section>

      <section class="candidate tile-pop">
        <h2>D. 타일형</h2>
        <p>패를 누를 때만 살짝 떠오릅니다. 패 선택의 손맛을 강조합니다.</p>
        <div class="demo-row">
          <button class="demo-button">예</button>
          <button class="tile-button" aria-label="패 효과 보기"><img class="tile-demo" src="../assets/tiles/b2/Ton.png" alt=""></button>
        </div>
      </section>
    </main>

    <script>
      for (const target of document.querySelectorAll("button")) {
        target.addEventListener("click", () => {
          target.classList.remove("is-clicked");
          void target.offsetWidth;
          target.classList.add("is-clicked");
          window.setTimeout(() => target.classList.remove("is-clicked"), 430);
        });
      }
    </script>
  </body>
</html>
